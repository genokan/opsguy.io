<dialog class="gallery-lightbox" aria-label="Expanded gallery image">
  <button class="gallery-lightbox__close" type="button" aria-label="Close image">&times;</button>
  <img class="gallery-lightbox__image" alt="">
</dialog>

<script>
  (() => {
    const lightbox = document.querySelector('.gallery-lightbox');
    if (!lightbox) return;

    const image = lightbox.querySelector('.gallery-lightbox__image');
    const close = () => lightbox.close();

    document.addEventListener('click', (event) => {
      const trigger = event.target.closest('.cooking-gallery__button');
      if (!trigger) return;

      image.src = trigger.dataset.gallerySrc;
      image.alt = trigger.dataset.galleryAlt;
      lightbox.showModal();
    });

    lightbox.querySelector('.gallery-lightbox__close').addEventListener('click', close);
    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) close();
    });
    lightbox.addEventListener('close', () => {
      image.removeAttribute('src');
      image.alt = '';
    });
  })();
</script>
